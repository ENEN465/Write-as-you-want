<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write as you want</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Barun+Gothic&family=Nanum+Myeongjo&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 안정적인 모듈 로드를 위한 Import Map -->
  <script type="importmap">
  {
    "imports": {
      "@tiptap/core": "https://esm.sh/@tiptap/core@2.1.13",
      "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.1.13",
      "@tiptap/extension-color": "https://esm.sh/@tiptap/extension-color@2.1.13",
      "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@2.1.13",
      "@tiptap/extension-font-family": "https://esm.sh/@tiptap/extension-font-family@2.1.13",
      "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@2.1.13",
      "@tiptap/extension-image": "https://esm.sh/@tiptap/extension-image@2.1.13",
      "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@2.1.13",
      "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@2.1.13",
      "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@2.1.13",
      "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@2.1.13",
      "@tiptap/extension-horizontal-rule": "https://esm.sh/@tiptap/extension-horizontal-rule@2.1.13"
    }
  }
  </script>
</head>
<body>

<div class="app-layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">내 글 목록</span>
      <div class="sidebar-actions">
        <button id="btn-add-folder" title="새 폴더">+ 폴더</button>
        <button id="btn-add-doc" title="새 문서">+ 문서</button>
      </div>
    </div>
    <div class="file-tree" id="file-tree"></div>
  </div>

  <div class="main-wrapper">
    <div class="toolbar">
      <div class="toolbar-section toolbar-left">
        <button id="btn-toggle-sidebar" title="사이드바 열기/닫기"><i data-lucide="panel-left"></i></button>
        <div class="save-status" id="save-status">저장됨</div>
      </div>

      <div class="toolbar-section toolbar-center">
        <select id="select-font">
          <option value="" disabled selected>글씨체</option>
          <option value="Pretendard">프리텐다드</option>
          <option value="MaruBuri">마루부리</option>
          <option value="RIDIBatang">리디바탕</option>
          <option value="NanumMyeongjo">나눔명조</option>
          <option value="'Noto Serif KR'">본명조</option>
          <option value="NanumBarunGothic">나눔바른고딕</option>
        </select>

        <select id="select-heading">
          <option value="p">본문</option>
          <option value="h1">제목 1</option>
          <option value="h2">제목 2</option>
          <option value="h3">제목 3</option>
        </select>

        <div class="toolbar-divider"></div>

        <button id="btn-bold" title="굵게"><i data-lucide="bold"></i></button>
        <button id="btn-italic" title="기울임"><i data-lucide="italic"></i></button>
        <button id="btn-strike" title="취소선"><i data-lucide="strikethrough"></i></button>

        <div class="toolbar-divider"></div>

        <div class="color-picker-wrapper">
          <button id="btn-color-palette" title="글자 색상"><i data-lucide="palette"></i></button>
          <div class="color-palette-popover" id="color-palette-popover">
            <div class="color-swatch" style="background:#212529" data-color="#212529"></div>
            <div class="color-swatch" style="background:#868e96" data-color="#868e96"></div>
            <div class="color-swatch" style="background:#fa5252" data-color="#fa5252"></div>
            <div class="color-swatch" style="background:#e64980" data-color="#e64980"></div>
            <div class="color-swatch" style="background:#be4bdb" data-color="#be4bdb"></div>
            <div class="color-swatch" style="background:#7950f2" data-color="#7950f2"></div>
            <div class="color-swatch" style="background:#228be6" data-color="#228be6"></div>
            <div class="color-swatch" style="background:#12b886" data-color="#12b886"></div>
            <div class="color-swatch" style="background:#40c057" data-color="#40c057"></div>
            <div class="color-swatch" style="background:#fd7e14" data-color="#fd7e14"></div>
          </div>
        </div>

        <div class="toolbar-divider"></div>

        <button id="btn-align-left" title="왼쪽 정렬"><i data-lucide="align-left"></i></button>
        <button id="btn-align-center" title="가운데 정렬"><i data-lucide="align-center"></i></button>
        <button id="btn-align-right" title="오른쪽 정렬"><i data-lucide="align-right"></i></button>
        <button id="btn-align-justify" title="양쪽 정렬"><i data-lucide="align-justify"></i></button>

        <div class="toolbar-divider"></div>

        <div class="table-menu-wrapper">
          <button id="btn-table-menu" title="표 관리"><i data-lucide="table"></i></button>
          <div class="table-popover" id="table-popover">
            <button id="btn-table-insert">➕ 표 생성 (3x3)</button>
            <button id="btn-table-add-row-before">⬆️ 위에 행 추가</button>
            <button id="btn-table-add-row-after">⬇️ 아래 행 추가</button>
            <button id="btn-table-add-col-before">⬅️ 왼쪽에 열 추가</button>
            <button id="btn-table-add-col-after">➡️ 오른쪽에 열 추가</button>
            <button id="btn-table-delete-row">➖ 행 삭제</button>
            <button id="btn-table-delete-col">➖ 열 삭제</button>
            <button id="btn-table-delete">❌ 표 삭제</button>
          </div>
        </div>

        <button id="btn-insert-image" title="이미지 삽입"><i data-lucide="image"></i></button>
        <input type="file" id="input-image-file" accept="image/*" style="display:none;">

        <select id="select-hr">
          <option value="" disabled selected>구분선</option>
          <option value="line">실선</option>
          <option value="dashed">점선</option>
          <option value="asterisk">별표 (***)</option>
          <option value="ornament">다이아 (◇◇◇)</option>
        </select>
      </div>

      <div class="toolbar-section toolbar-right">
        <button id="btn-open-search" title="찾기 및 바꾸기"><i data-lucide="search"></i></button>
        <div class="word-counter-wrapper">
          <div class="counter-badge" id="counter-badge">0자</div>
          <div class="counter-dropdown" id="counter-dropdown">
            <div class="counter-item active" data-type="char-no-space"><span>공백 제외 글자 수</span><span class="check-mark">✓</span></div>
            <div class="counter-item" data-type="char-with-space"><span>공백 포함 글자 수</span><span class="check-mark">✓</span></div>
            <div class="counter-item" data-type="word"><span>단어 수</span><span class="check-mark">✓</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="editor-container" id="editor-container">
        <div class="post-header">
          <input type="text" class="title-input" id="title-input" placeholder="제목을 입력하세요">
          <input type="text" class="subtitle-input" id="subtitle-input" placeholder="소제목을 입력하세요 (선택)">
          <hr class="header-divider">
        </div>
        <div id="editor"></div>
      </div>
    </div>
  </div>
</div>

<!-- 단어 찾기 및 일괄 수정 모달 -->
<div class="search-modal" id="search-modal">
  <div class="search-row">
    <input type="text" id="search-input" placeholder="찾을 단어 입력...">
    <button id="btn-close-search">✕</button>
  </div>
  <div class="search-row">
    <input type="text" id="replace-input" placeholder="바꿀 단어 입력...">
    <button id="btn-replace-all">일괄 수정</button>
  </div>
  <div class="search-status">
    <span id="search-count">검색어 대기 중</span>
  </div>
</div>

<script type="module">
  import { Editor } from '@tiptap/core';
  import StarterKit from '@tiptap/starter-kit';
  import HorizontalRule from '@tiptap/extension-horizontal-rule';
  import TextStyle from '@tiptap/extension-text-style';
  import Color from '@tiptap/extension-color';
  import FontFamily from '@tiptap/extension-font-family';
  import TextAlign from '@tiptap/extension-text-align';
  import Image from '@tiptap/extension-image';
  import Table from '@tiptap/extension-table';
  import TableRow from '@tiptap/extension-table-row';
  import TableCell from '@tiptap/extension-table-cell';
  import TableHeader from '@tiptap/extension-table-header';

  // 1. 커스텀 구분선 확장
  const CustomHorizontalRule = HorizontalRule.extend({
    addAttributes() {
      return {
        'data-style': {
          default: 'line',
          parseHTML: element => element.getAttribute('data-style'),
          renderHTML: attributes => { return { 'data-style': attributes['data-style'] }; },
        },
      };
    },
  });

  let treeData = JSON.parse(localStorage.getItem('my_tree_data')) || [
    { id: 'f-1', name: '기본 폴더', type: 'folder', isOpen: true, children: [
        { id: 'd-1', name: '첫 번째 글', type: 'doc', content: '<p>글을 작성해보세요!</p>', title: '첫 번째 글', subtitle: '' }
      ] }
  ];
  let activeDocId = localStorage.getItem('my_active_doc_id') || 'd-1';
  let counterType = 'char-no-space';

  // 2. 에디터 인스턴스 생성
  const editor = new Editor({
    element: document.querySelector('#editor'),
    extensions: [
      StarterKit.configure({ horizontalRule: false }), // 기본 HR 끄고 커스텀 HR 사용
      CustomHorizontalRule,
      TextStyle, 
      Color, 
      FontFamily, // 폰트 확장 추가
      Image,
      TextAlign.configure({ types: ['heading', 'paragraph'] }),
      Table.configure({ resizable: true }),
      TableRow, TableHeader, TableCell,
    ],
    content: '',
    onUpdate() { updateWordCount(); triggerAutoSave(); },
    onSelectionUpdate() { updateToolbarState(); }
  });

  // 3. 툴바 버튼 상태 업데이트 (활성화 된 포맷 표시)
  function updateToolbarState() {
    document.getElementById('btn-bold').classList.toggle('is-active', editor.isActive('bold'));
    document.getElementById('btn-italic').classList.toggle('is-active', editor.isActive('italic'));
    document.getElementById('btn-strike').classList.toggle('is-active', editor.isActive('strike'));
    
    // 제목 셀렉트박스 동기화
    const headingSelect = document.getElementById('select-heading');
    if (editor.isActive('heading', { level: 1 })) headingSelect.value = 'h1';
    else if (editor.isActive('heading', { level: 2 })) headingSelect.value = 'h2';
    else if (editor.isActive('heading', { level: 3 })) headingSelect.value = 'h3';
    else headingSelect.value = 'p';
  }

  // 4. 서식 버튼 이벤트 리스너 (.chain().focus()를 이용해 클릭 후 에디터로 포커스 반환)
  document.getElementById('btn-bold').addEventListener('click', () => editor.chain().focus().toggleBold().run());
  document.getElementById('btn-italic').addEventListener('click', () => editor.chain().focus().toggleItalic().run());
  document.getElementById('btn-strike').addEventListener('click', () => editor.chain().focus().toggleStrike().run());

  document.getElementById('btn-align-left').addEventListener('click', () => editor.chain().focus().setTextAlign('left').run());
  document.getElementById('btn-align-center').addEventListener('click', () => editor.chain().focus().setTextAlign('center').run());
  document.getElementById('btn-align-right').addEventListener('click', () => editor.chain().focus().setTextAlign('right').run());
  document.getElementById('btn-align-justify').addEventListener('click', () => editor.chain().focus().setTextAlign('justify').run());

  // 5. 드롭다운 변경 이벤트
  document.getElementById('select-heading').addEventListener('change', (e) => {
    const v = e.target.value;
    if (v === 'p') editor.chain().focus().setParagraph().run();
    else editor.chain().focus().toggleHeading({ level: parseInt(v.replace('h','')) }).run();
  });

  document.getElementById('select-font').addEventListener('change', (e) => {
    if (e.target.value) {
      editor.chain().focus().setFontFamily(e.target.value).run();
      e.target.value = ''; // 선택 후 초기화하여 깔끔하게
    }
  });

  document.getElementById('select-hr').addEventListener('change', (e) => {
    if (e.target.value) {
      editor.chain().focus().insertContent({ type: 'horizontalRule', attrs: { 'data-style': e.target.value } }).run();
      e.target.value = ''; 
    }
  });

  // 6. 컬러 피커 제어
  const paletteBtn = document.getElementById('btn-color-palette');
  const palettePopover = document.getElementById('color-palette-popover');
  paletteBtn.addEventListener('click', (e) => { e.stopPropagation(); palettePopover.classList.toggle('show'); });
  
  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', (e) => {
      e.stopPropagation();
      const color = swatch.getAttribute('data-color');
      editor.chain().focus().setColor(color).run();
      palettePopover.classList.remove('show');
    });
  });

  // 7. 표 기능 제어
  const tableBtn = document.getElementById('btn-table-menu');
  const tablePopover = document.getElementById('table-popover');
  tableBtn.addEventListener('click', (e) => { e.stopPropagation(); tablePopover.classList.toggle('show'); });
  
  const execTable = (fn) => () => { fn(); tablePopover.classList.remove('show'); };
  document.getElementById('btn-table-insert').addEventListener('click', execTable(() => editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run()));
  document.getElementById('btn-table-add-row-before').addEventListener('click', execTable(() => editor.chain().focus().addRowBefore().run()));
  document.getElementById('btn-table-add-row-after').addEventListener('click', execTable(() => editor.chain().focus().addRowAfter().run()));
  document.getElementById('btn-table-add-col-before').addEventListener('click', execTable(() => editor.chain().focus().addColumnBefore().run()));
  document.getElementById('btn-table-add-col-after').addEventListener('click', execTable(() => editor.chain().focus().addColumnAfter().run()));
  document.getElementById('btn-table-delete-row').addEventListener('click', execTable(() => editor.chain().focus().deleteRow().run()));
  document.getElementById('btn-table-delete-col').addEventListener('click', execTable(() => editor.chain().focus().deleteColumn().run()));
  document.getElementById('btn-table-delete').addEventListener('click', execTable(() => editor.chain().focus().deleteTable().run()));

  // 8. 기타 기능(이미지, 찾기, 파일트리 등 기존 동일 로직)
  document.getElementById('btn-insert-image').onclick = () => document.getElementById('input-image-file').click();
  document.getElementById('input-image-file').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => editor.chain().focus().setImage({ src: event.target.result }).run();
      reader.readAsDataURL(file);
    }
  };

  /* 찾기 및 일괄 수정 */
  const searchModal = document.getElementById('search-modal');
  const searchInput = document.getElementById('search-input');
  const searchCount = document.getElementById('search-count');
  let originalHtmlForSearch = null;

  document.getElementById('btn-open-search').onclick = (e) => {
    e.stopPropagation(); searchModal.classList.toggle('show');
    if (searchModal.classList.contains('show')) { originalHtmlForSearch = editor.getHTML(); searchInput.focus(); } 
    else { clearSearch(); }
  };
  document.getElementById('btn-close-search').onclick = () => clearSearch();

  function clearSearch() {
    searchModal.classList.remove('show');
    if(originalHtmlForSearch !== null) {
      const cleanContent = originalHtmlForSearch.replace(/<mark class="search-highlight">/g, '').replace(/<\/mark>/g, '');
      editor.commands.setContent(cleanContent); originalHtmlForSearch = null;
    }
    searchCount.textContent = '검색어 대기 중'; searchInput.value = '';
  }

  searchInput.oninput = () => {
    const term = searchInput.value;
    if (!term) {
      if(originalHtmlForSearch) editor.commands.setContent(originalHtmlForSearch.replace(/<mark class="search-highlight">/g, '').replace(/<\/mark>/g, ''));
      searchCount.textContent = '0건 발견'; return;
    }
    if (originalHtmlForSearch === null) originalHtmlForSearch = editor.getHTML();
    const cleanHtml = originalHtmlForSearch.replace(/<mark class="search-highlight">/g, '').replace(/<\/mark>/g, '');
    const regex = new RegExp(`(${term})(?![^<]*>|[^<>]*<\/)`, 'gi');
    let matchCount = 0;
    const highlightedHtml = cleanHtml.replace(regex, (match) => { matchCount++; return `<mark class="search-highlight">${match}</mark>`; });
    editor.commands.setContent(highlightedHtml);
    searchCount.textContent = `${matchCount}건 발견`;
  };

  document.getElementById('btn-replace-all').onclick = () => {
    const term = searchInput.value;
    const replaceWith = document.getElementById('replace-input').value;
    if(!term) return;
    const cleanHtml = originalHtmlForSearch ? originalHtmlForSearch.replace(/<mark class="search-highlight">/g, '').replace(/<\/mark>/g, '') : editor.getHTML();
    const regex = new RegExp(`(${term})(?![^<]*>|[^<>]*<\/)`, 'gi');
    const newHtml = cleanHtml.replace(regex, replaceWith);
    editor.commands.setContent(newHtml);
    originalHtmlForSearch = newHtml; searchInput.value = ''; searchCount.textContent = '일괄 수정 완료!'; triggerAutoSave();
  };

  /* 세이브, 로드, 파일트리 */
  function findNode(nodes, id) {
    for (let node of nodes) {
      if (node.id === id) return node;
      if (node.children) { let res = findNode(node.children, id); if (res) return res; }
    } return null;
  }
  function loadDoc(docId) {
    const doc = findNode(treeData, docId); if (!doc) return;
    activeDocId = docId; localStorage.setItem('my_active_doc_id', docId);
    document.getElementById('title-input').value = doc.title || doc.name || '';
    document.getElementById('subtitle-input').value = doc.subtitle || '';
    editor.commands.setContent(doc.content || '');
    if(originalHtmlForSearch) originalHtmlForSearch = null;
    updateWordCount(); renderTree();
  }

  let saveTimer = null;
  function triggerAutoSave() {
    const status = document.getElementById('save-status');
    status.textContent = '저장 중...'; status.className = 'save-status saving';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const doc = findNode(treeData, activeDocId);
      if (doc) {
        doc.title = document.getElementById('title-input').value;
        doc.subtitle = document.getElementById('subtitle-input').value;
        doc.name = doc.title || '제목 없음';
        doc.content = originalHtmlForSearch !== null ? originalHtmlForSearch.replace(/<mark class="search-highlight">/g, '').replace(/<\/mark>/g, '') : editor.getHTML();
        localStorage.setItem('my_tree_data', JSON.stringify(treeData));
        status.textContent = '저장됨'; status.className = 'save-status synced';
        renderTree();
      }
    }, 800);
  }

  function updateWordCount() {
    const text = editor.getText(); let count = 0;
    if (counterType === 'char-no-space') count = text.replace(/\s/g, '').length;
    else if (counterType === 'char-with-space') count = text.length;
    else if (counterType === 'word') count = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    document.getElementById('counter-badge').textContent = `${count.toLocaleString()}${counterType === 'word' ? '단어' : '자'}`;
  }

  document.getElementById('btn-add-folder').onclick = () => {
    const name = prompt("새 폴더 이름을 입력하세요:");
    if(name) { treeData.push({ id: 'f-' + Date.now(), name, type: 'folder', isOpen: true, children: [] }); renderTree(); triggerAutoSave(); }
  };
  document.getElementById('btn-add-doc').onclick = () => {
    const name = prompt("새 문서 이름을 입력하세요:");
    if(name) {
      if(treeData.length === 0) treeData.push({ id: 'f-1', name: '기본 폴더', type: 'folder', isOpen: true, children: [] });
      const newDoc = { id: 'd-' + Date.now(), name, type: 'doc', content: '<p>새로운 문서입니다.</p>', title: name, subtitle: '' };
      treeData[0].children.push(newDoc); renderTree(); loadDoc(newDoc.id); triggerAutoSave();
    }
  };

  /* 바탕 클릭 시 팝업 닫기 */
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.color-picker-wrapper')) palettePopover.classList.remove('show');
    if (!e.target.closest('.table-menu-wrapper')) tablePopover.classList.remove('show');
    if (!e.target.closest('.word-counter-wrapper')) document.getElementById('counter-dropdown').classList.remove('show');
  });
  
  document.getElementById('counter-badge').onclick = (e) => { e.stopPropagation(); document.getElementById('counter-dropdown').classList.toggle('show'); }
  document.querySelectorAll('.counter-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation(); document.querySelectorAll('.counter-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active'); counterType = item.getAttribute('data-type'); updateWordCount();
      document.getElementById('counter-dropdown').classList.remove('show');
    };
  });

  document.getElementById('btn-toggle-sidebar').onclick = () => document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('title-input').oninput = triggerAutoSave;
  document.getElementById('subtitle-input').oninput = triggerAutoSave;

  function renderTree() {
    const container = document.getElementById('file-tree');
    container.innerHTML = '';
    treeData.forEach(folder => {
      const folderDiv = document.createElement('div'); folderDiv.className = 'tree-folder';
      const titleDiv = document.createElement('div'); titleDiv.className = 'tree-folder-title';
      titleDiv.innerHTML = `<span class="folder-label">${folder.isOpen ? '▼' : '▶'} 📁 ${folder.name}</span>`;
      titleDiv.onclick = () => { folder.isOpen = !folder.isOpen; renderTree(); };
      folderDiv.appendChild(titleDiv);
      if (folder.isOpen && folder.children) {
        folder.children.forEach(doc => {
          const itemDiv = document.createElement('div'); itemDiv.className = `tree-item ${doc.id === activeDocId ? 'active' : ''}`;
          itemDiv.innerHTML = `📄 ${doc.name || '제목 없음'}`;
          itemDiv.onclick = (e) => { e.stopPropagation(); loadDoc(doc.id); };
          folderDiv.appendChild(itemDiv);
        });
      }
      container.appendChild(folderDiv);
    });
  }

  renderTree(); loadDoc(activeDocId); lucide.createIcons();
</script>

</body>
</html>
