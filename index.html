<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write as you want</title>
  
  <!-- 외부 CSS 분리 파일 연결 -->
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="icon" href="./icon.webp" type="image/webp">

  <!-- 폰트 불러오기 -->
  <link rel="stylesheet" as="style" crossorigin href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Barun+Gothic&family=Nanum+Myeongjo&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Lucide 아이콘 라이브러리 추가 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-layout">
  
  <!-- 1. 좌측 사이드바 (파일 목록 영역) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">내 글 목록</span>
      <div class="sidebar-actions">
        <button id="btn-add-folder" title="새 폴더">+ 폴더</button>
        <button id="btn-add-doc" title="새 문서">+ 문서</button>
      </div>
    </div>
    <div class="file-tree" id="file-tree"></div>
  </div>

  <!-- 2. 우측 메인 영역 (상단바 + 편집기) -->
  <div class="main-wrapper">
    
    <!-- 우측 영역 최상단 툴바 -->
    <div class="toolbar">
      <button id="btn-toggle-sidebar" title="사이드바 열기/닫기"><i data-lucide="panel-left"></i></button>
      <button id="btn-sync-setting" title="연동 설정"><i data-lucide="cloud"></i></button>
      <div class="save-status" id="save-status"></div>

      <div class="toolbar-divider"></div>

      <!-- 폰트 & 스타일 -->
      <select id="select-font">
        <option value="font-maruburi">마루부리</option>
        <option value="font-pretendard">프리텐다드</option>
        <option value="font-bookk-myungjo">부크크명조</option>
        <option value="font-nanum-myeongjo">나눔명조</option>
        <option value="font-noto-serif">본명조</option>
        <option value="font-nanum-barun">나눔바른고딕</option>
      </select>

      <select id="select-heading">
        <option value="p">본문</option>
        <option value="h1">제목 1</option>
        <option value="h2">제목 2</option>
        <option value="h3">제목 3</option>
      </select>

      <div class="toolbar-divider"></div>

      <!-- 서식 (볼드, 이탈릭, 취소선, 첨자) -->
      <button id="btn-bold" title="굵게"><i data-lucide="bold"></i></button>
      <button id="btn-italic" title="기울임"><i data-lucide="italic"></i></button>
      <button id="btn-strike" title="취소선"><i data-lucide="strikethrough"></i></button>
      <button id="btn-subscript" title="아래 첨자"><i data-lucide="subscript"></i></button>
      <button id="btn-superscript" title="위 첨자"><i data-lucide="superscript"></i></button>

      <div class="toolbar-divider"></div>

      <!-- 글씨 색상 -->
      <input type="color" id="input-text-color" title="글자 색상 변경" value="#212529">

      <!-- 정렬 -->
      <button id="btn-align-left" title="왼쪽 정렬"><i data-lucide="align-left"></i></button>
      <button id="btn-align-center" title="가운데 정렬"><i data-lucide="align-center"></i></button>
      <button id="btn-align-right" title="오른쪽 정렬"><i data-lucide="align-right"></i></button>
      <button id="btn-align-justify" title="양쪽 정렬"><i data-lucide="align-justify"></i></button>

      <div class="toolbar-divider"></div>

      <!-- 표 & 이미지 -->
      <button id="btn-insert-table" title="표 삽입"><i data-lucide="table"></i></button>
      <button id="btn-insert-image" title="이미지 삽입"><i data-lucide="image"></i></button>

      <!-- 구분선 -->
      <select id="select-hr">
        <option value="" disabled selected>구분선</option>
        <option value="line">실선</option>
        <option value="dashed">점선</option>
        <option value="asterisk">별표 (***)</option>
        <option value="ornament">다이아 (◇◇◇)</option>
      </select>

      <div class="toolbar-divider"></div>

      <button id="btn-open-search" title="찾기"><i data-lucide="search"></i></button>

      <!-- 글자 수 카운터 -->
      <div class="word-counter-wrapper">
        <div class="counter-badge" id="counter-badge">0자</div>
        <div class="counter-dropdown" id="counter-dropdown">
          <div class="counter-item active" data-type="char-no-space">
            <span>공백 제외 글자 수</span>
            <span class="check-mark">✓</span>
          </div>
          <div class="counter-item" data-type="char-with-space">
            <span>공백 포함 글자 수</span>
            <span class="check-mark">✓</span>
          </div>
          <div class="counter-item" data-type="word">
            <span>단어 수</span>
            <span class="check-mark">✓</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 영역 본문 에디터 -->
    <div class="main-content">
      <div class="editor-container font-maruburi" id="editor-container">
        <div class="post-header">
          <input type="text" class="title-input" id="title-input" placeholder="제목을 입력하세요">
          <input type="text" class="subtitle-input" id="subtitle-input" placeholder="소제목을 입력하세요 (선택)">
          <hr class="header-divider">
        </div>
        <div id="editor"></div>
      </div>
    </div>

  </div> <!-- /main-wrapper -->
</div>

<!-- 검색 모달 -->
<div class="search-modal" id="search-modal">
  <div class="search-row">
    <input type="text" id="search-input" placeholder="찾을 단어...">
    <button id="btn-search-prev">◀</button>
    <button id="btn-search-next">▶</button>
    <button id="btn-close-search">X</button>
  </div>
  <div class="search-status">
    <span id="search-count">0/0</span>
  </div>
</div>

<!-- Firebase 연동 설정 모달 -->
<div class="sync-modal" id="sync-modal">
  <h4 style="margin-bottom:12px; font-size:14px;">🔥 Firebase 실시간 연동 설정</h4>
  <div class="modal-field">
    <label>Database URL</label>
    <input type="text" id="cfg-db-url" placeholder="https://your-app.firebaseio.com">
  </div>
  <div class="modal-field">
    <label>API Key</label>
    <input type="text" id="cfg-api-key" placeholder="AIzaSy...">
  </div>
  <div style="display:flex; justify-content:space-between; margin-top:14px;">
    <button id="btn-save-sync" style="background:#339af0; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">저장 및 연결</button>
    <button id="btn-close-sync" style="background:#f1f3f5; border:1px solid #dee2e6; padding:6px 12px; border-radius:4px; cursor:pointer;">닫기</button>
  </div>
</div>

<!-- TipTap 모듈 및 필수 라이브러리 (ESM) -->
<script type="module">
  import { Editor } from 'https://esm.sh/@tiptap/core@2.1.13';
  import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.1.13';
  import Subscript from 'https://esm.sh/@tiptap/extension-subscript@2.1.13';
  import Superscript from 'https://esm.sh/@tiptap/extension-superscript@2.1.13';
  import HorizontalRule from 'https://esm.sh/@tiptap/extension-horizontal-rule@2.1.13';
  import TextStyle from 'https://esm.sh/@tiptap/extension-text-style@2.1.13';
  import Color from 'https://esm.sh/@tiptap/extension-color@2.1.13';
  import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@2.1.13';
  import Image from 'https://esm.sh/@tiptap/extension-image@2.1.13';
  import Table from 'https://esm.sh/@tiptap/extension-table@2.1.13';
  import TableRow from 'https://esm.sh/@tiptap/extension-table-row@2.1.13';
  import TableCell from 'https://esm.sh/@tiptap/extension-table-cell@2.1.13';
  import TableHeader from 'https://esm.sh/@tiptap/extension-table-header@2.1.13';

  // 커스텀 구분선 확장
  const CustomHorizontalRule = HorizontalRule.extend({
    addAttributes() {
      return {
        'data-style': {
          default: 'line',
          parseHTML: element => element.getAttribute('data-style'),
          renderHTML: attributes => {
            return { 'data-style': attributes['data-style'] };
          },
        },
      };
    },
  });

  // 데이터 구조
  let treeData = JSON.parse(localStorage.getItem('my_tree_data')) || [
    { id: 'f-1', name: '기본 폴더', type: 'folder', isOpen: true, children: [
        { id: 'd-1', name: '첫 번째 글', type: 'doc', content: '<p>글을 작성해보세요!</p>', title: '첫 번째 글', subtitle: '' }
      ] 
    }
  ];
  let activeDocId = localStorage.getItem('my_active_doc_id') || 'd-1';
  let counterType = 'char-no-space';
  let firebaseRef = null;

  // TipTap 에디터 초기화
  const editor = new Editor({
    element: document.querySelector('#editor'),
    extensions: [
      StarterKit.configure({ horizontalRule: false }),
      Subscript,
      Superscript,
      CustomHorizontalRule,
      TextStyle,
      Color,
      Image,
      TextAlign.configure({ types: ['heading', 'paragraph'] }),
      Table.configure({ resizable: true }),
      TableRow,
      TableHeader,
      TableCell,
    ],
    content: '',
    onUpdate({ editor }) {
      updateWordCount();
      triggerAutoSave();
    },
    onSelectionUpdate({ editor }) {
      updateToolbarState();
    }
  });

  // 문서 세팅
  function loadDoc(docId) {
    const doc = findNode(treeData, docId);
    if (!doc) return;
    activeDocId = docId;
    localStorage.setItem('my_active_doc_id', docId);

    document.getElementById('title-input').value = doc.title || doc.name || '';
    document.getElementById('subtitle-input').value = doc.subtitle || '';
    editor.commands.setContent(doc.content || '');
    updateWordCount();
    renderTree();
  }

  function findNode(nodes, id) {
    for (let node of nodes) {
      if (node.id === id) return node;
      if (node.children) {
        let res = findNode(node.children, id);
        if (res) return res;
      }
    }
    return null;
  }

  // 자동 저장
  let saveTimer = null;
  function triggerAutoSave() {
    const status = document.getElementById('save-status');
    status.textContent = '저장 중...';
    status.className = 'save-status saving';

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const doc = findNode(treeData, activeDocId);
      if (doc) {
        doc.title = document.getElementById('title-input').value;
        doc.subtitle = document.getElementById('subtitle-input').value;
        doc.name = doc.title || '제목 없음';
        doc.content = editor.getHTML();

        localStorage.setItem('my_tree_data', JSON.stringify(treeData));

        if (firebaseRef) {
          firebaseRef.set(treeData);
        }

        status.textContent = '저장됨';
        status.className = 'save-status synced';
        renderTree();
      }
    }, 800);
  }

  // 글자수 측정
  function updateWordCount() {
    const text = editor.getText();
    let count = 0;
    if (counterType === 'char-no-space') {
      count = text.replace(/\s/g, '').length;
    } else if (counterType === 'char-with-space') {
      count = text.length;
    } else if (counterType === 'word') {
      count = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    }
    document.getElementById('counter-badge').textContent = `${count.toLocaleString()}${counterType === 'word' ? '단어' : '자'}`;
  }

  // 툴바 버튼 활성화 상태
  function updateToolbarState() {
    document.getElementById('btn-bold').classList.toggle('is-active', editor.isActive('bold'));
    document.getElementById('btn-italic').classList.toggle('is-active', editor.isActive('italic'));
    document.getElementById('btn-strike').classList.toggle('is-active', editor.isActive('strike'));
    document.getElementById('btn-subscript').classList.toggle('is-active', editor.isActive('subscript'));
    document.getElementById('btn-superscript').classList.toggle('is-active', editor.isActive('superscript'));
  }

  // 툴바 이벤트 연결
  document.getElementById('btn-bold').onclick = () => editor.chain().focus().toggleBold().run();
  document.getElementById('btn-italic').onclick = () => editor.chain().focus().toggleItalic().run();
  document.getElementById('btn-strike').onclick = () => editor.chain().focus().toggleStrike().run();
  document.getElementById('btn-subscript').onclick = () => editor.chain().focus().toggleSubscript().run();
  document.getElementById('btn-superscript').onclick = () => editor.chain().focus().toggleSuperscript().run();

  // 정렬 기능
  document.getElementById('btn-align-left').onclick = () => editor.chain().focus().setTextAlign('left').run();
  document.getElementById('btn-align-center').onclick = () => editor.chain().focus().setTextAlign('center').run();
  document.getElementById('btn-align-right').onclick = () => editor.chain().focus().setTextAlign('right').run();
  document.getElementById('btn-align-justify').onclick = () => editor.chain().focus().setTextAlign('justify').run();

  // 색상 변경
  document.getElementById('input-text-color').oninput = (e) => {
    editor.chain().focus().setColor(e.target.value).run();
  };

  // 표 삽입 (3x3 기본)
  document.getElementById('btn-insert-table').onclick = () => {
    editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run();
  };

  // 이미지 삽입
  document.getElementById('btn-insert-image').onclick = () => {
    const url = prompt('이미지 URL을 입력하세요:');
    if (url) {
      editor.chain().focus().setImage({ src: url }).run();
    }
  };

  // 제목/본문 변환
  document.getElementById('select-heading').onchange = (e) => {
    const val = e.target.value;
    if (val === 'p') editor.chain().focus().setParagraph().run();
    else if (val === 'h1') editor.chain().focus().toggleHeading({ level: 1 }).run();
    else if (val === 'h2') editor.chain().focus().toggleHeading({ level: 2 }).run();
    else if (val === 'h3') editor.chain().focus().toggleHeading({ level: 3 }).run();
  };

  // 구분선 삽입
  document.getElementById('select-hr').onchange = (e) => {
    const style = e.target.value;
    if (style) {
      editor.chain().focus().insertContent({ type: 'horizontalRule', attrs: { 'data-style': style } }).run();
      e.target.value = '';
    }
  };

  // 폰트 스타일 변경
  document.getElementById('select-font').onchange = (e) => {
    const container = document.getElementById('editor-container');
    container.className = `editor-container ${e.target.value}`;
  };

  // 카운터 드롭다운 토글
  const badge = document.getElementById('counter-badge');
  const dropdown = document.getElementById('counter-dropdown');
  badge.onclick = (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('show');
  };
  document.addEventListener('click', () => dropdown.classList.remove('show'));

  document.querySelectorAll('.counter-item').forEach(item => {
    item.onclick = () => {
      document.querySelectorAll('.counter-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      counterType = item.getAttribute('data-type');
      updateWordCount();
    };
  });

  // 사이드바 토글
  document.getElementById('btn-toggle-sidebar').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  };

  // 제목 / 소제목 변경 시 자동 저장
  document.getElementById('title-input').oninput = triggerAutoSave;
  document.getElementById('subtitle-input').oninput = triggerAutoSave;

  // 파일 트리 리렌더링
  function renderTree() {
    const container = document.getElementById('file-tree');
    container.innerHTML = '';

    treeData.forEach(folder => {
      const folderDiv = document.createElement('div');
      folderDiv.className = 'tree-folder';
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'tree-folder-title';
      titleDiv.innerHTML = `
        <span class="folder-label">
          <span class="folder-toggle-icon">${folder.isOpen ? '▼' : '▶'}</span> 📁 ${folder.name}
        </span>
      `;
      titleDiv.onclick = () => {
        folder.isOpen = !folder.isOpen;
        renderTree();
      };

      folderDiv.appendChild(titleDiv);

      if (folder.isOpen && folder.children) {
        folder.children.forEach(doc => {
          const itemDiv = document.createElement('div');
          itemDiv.className = `tree-item ${doc.id === activeDocId ? 'active' : ''}`;
          itemDiv.innerHTML = `📄 ${doc.name || '제목 없음'}`;
          itemDiv.onclick = (e) => {
            e.stopPropagation();
            loadDoc(doc.id);
          };
          folderDiv.appendChild(itemDiv);
        });
      }
      container.appendChild(folderDiv);
    });
  }

  // 초기화 실행
  renderTree();
  loadDoc(activeDocId);

  // Lucide 아이콘 최종 변환 실행
  lucide.createIcons();
</script>

</body>
</html>
