<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write as you want</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
  <!-- 사이드바 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-wrapper">
        <img src="icon.webp" alt="App Icon" class="app-icon">
        <span class="sidebar-title">내 글 목록</span>
      </div>
      <div class="sidebar-actions">
        <button id="btn-add-folder" title="새 폴더">+ 폴더</button>
        <button id="btn-add-doc" title="새 문서">+ 문서</button>
      </div>
    </div>
    <div class="file-tree" id="file-tree"></div>
  </div>

  <!-- 메인 영역 -->
  <div class="main-wrapper">
    <div class="toolbar">
      <div class="toolbar-section toolbar-left">
        <button id="btn-toggle-sidebar" title="사이드바 열기/닫기"><i data-lucide="panel-left"></i></button>
        <div class="save-status" id="save-status">저장됨</div>
      </div>

      <div class="toolbar-section toolbar-center">
        <!-- 폰트 선택 -->
        <select id="select-font">
          <option value="MaruBuri" selected>마루부리</option>
          <option value="Pretendard">프리텐다드</option>
          <option value="RIDIBatang">리디바탕</option>
          <option value="'Nanum Myeongjo'">나눔명조</option>
          <option value="'Noto Serif KR'">본명조</option>
          <option value="'Nanum Barun Gothic'">나눔바른고딕</option>
        </select>
        
        <!-- 제목/본문 선택 -->
        <select id="select-heading">
          <option value="p">본문</option>
          <option value="h1">제목 1</option>
          <option value="h2">제목 2</option>
          <option value="h3">제목 3</option>
        </select>

        <div class="toolbar-divider"></div>

        <!-- 서식 버튼 -->
        <button id="btn-bold" title="굵게"><i data-lucide="bold"></i></button>
        <button id="btn-italic" title="기울임"><i data-lucide="italic"></i></button>
        <button id="btn-strike" title="취소선"><i data-lucide="strikethrough"></i></button>

        <div class="toolbar-divider"></div>

        <!-- 글자 색상 선택기 -->
        <div class="color-picker-wrapper" style="position: relative; display: inline-flex; align-items: center;">
          <button id="btn-color-palette" title="글자 색상" type="button"><i data-lucide="palette"></i></button>
          <input type="color" id="input-font-color" value="#212529" 
                 style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
        </div>

        <div class="toolbar-divider"></div>

        <!-- 정렬 버튼 -->
        <button id="btn-align-left" title="왼쪽 정렬"><i data-lucide="align-left"></i></button>
        <button id="btn-align-center" title="가운데 정렬"><i data-lucide="align-center"></i></button>
        <button id="btn-align-right" title="오른쪽 정렬"><i data-lucide="align-right"></i></button>
        <button id="btn-align-justify" title="양쪽 정렬"><i data-lucide="align-justify"></i></button>

        <div class="toolbar-divider"></div>

        <!-- 이미지 및 구분선 -->
        <button id="btn-insert-image" title="이미지 삽입"><i data-lucide="image"></i></button>
        <input type="file" id="input-image-file" accept="image/*" style="display:none;">

        <select id="select-hr">
          <option value="" disabled selected>구분선</option>
          <option value="line">실선</option>
          <option value="dashed">점선</option>
          <option value="asterisk">별표 (***)</option>
          <option value="ornament">다이아 (◇◇◇)</option>
        </select>

        <div class="toolbar-divider"></div>

        <!-- 찾기 버튼 -->
        <button id="btn-search" title="찾기 및 바꾸기"><i data-lucide="search"></i></button>
      </div>

      <div class="toolbar-section toolbar-right">
        <!-- 글자 수 계산 -->
        <div class="word-counter-wrapper">
          <button id="btn-word-count-toggle" class="word-count-btn">
            <span id="word-count-label">0자</span>
            <i data-lucide="chevron-down"></i>
          </button>
          
          <div class="word-count-popover" id="word-count-popover" style="display: none;">
            <div class="word-count-option active" data-mode="withSpace">
              <span>공백 포함: <strong id="cnt-with-space">0자</strong></span>
              <i data-lucide="check" class="check-icon"></i>
            </div>
            <div class="word-count-option" data-mode="noSpace">
              <span>공백 제외: <strong id="cnt-no-space">0자</strong></span>
              <i data-lucide="check" class="check-icon"></i>
            </div>
            <div class="word-count-option" data-mode="noSpaceSpecial">
              <span>공백, 특문 제외: <strong id="cnt-no-spec">0자</strong></span>
              <i data-lucide="check" class="check-icon"></i>
            </div>
            <div class="word-count-option" data-mode="words">
              <span>단어 수: <strong id="cnt-words">0 단어</strong></span>
              <i data-lucide="check" class="check-icon"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 찾기/바꾸기 팝업 (기본 상태 숨김) -->
    <div class="search-popover-box" id="search-popover-box" style="display: none;">
      <div class="search-top-row">
        <input type="text" id="input-search" placeholder="찾을 단어" class="search-input-field">
        <span class="search-count-badge" id="search-count-badge">0 / 0</span>
        <button id="btn-search-prev" class="icon-btn-sm" title="이전"><i data-lucide="chevron-up"></i></button>
        <button id="btn-search-next" class="icon-btn-sm" title="다음"><i data-lucide="chevron-down"></i></button>
        <button id="btn-toggle-replace" class="icon-btn-sm" title="바꾸기 열기/닫기"><i data-lucide="repeat"></i></button>
        <button id="btn-search-close" class="icon-btn-sm">✕</button>
      </div>

      <div class="replace-bottom-row" id="replace-bottom-row" style="display: none;">
        <input type="text" id="input-replace" placeholder="바꿀 단어" class="replace-input-field">
        <button id="btn-replace-one" class="action-btn-sm">바꾸기</button>
        <button id="btn-replace-all" class="action-btn-sm highlight-btn">모두 바꾸기</button>
      </div>
    </div>

    <!-- 에디터 영역 -->
    <div class="main-content">
      <div class="editor-container" id="editor-container">
        <div class="post-header">
          <input type="text" class="title-input" id="title-input" placeholder="제목을 입력하세요">
          <input type="text" class="subtitle-input" id="subtitle-input" placeholder="소제목을 입력하세요 (선택)">
          <hr class="header-divider">
        </div>
        <div id="editor"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
