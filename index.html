<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>write as you want</title>
  <link rel="icon" type="image/webp" href="icon.webp?v=1">
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 사이드바 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">문서 목록</span>
        <div class="sidebar-actions">
          <button id="btn-add-folder" title="새 폴더">+ 폴더</button>
          <button id="btn-add-doc" title="새 문서">+ 문서</button>
        </div>
      </div>
      
      <!-- 스크롤 가능한 트리 영역 -->
      <div class="sidebar-body">
        <div id="file-tree" class="file-tree"></div>
      </div>

      <!-- 하단 고정 휴지통 영역 -->
      <div class="trash-section">
        <div id="trash-header" class="trash-header">
          <span>🗑️ 휴지통 (30일 보관)</span>
          <button id="btn-empty-trash" class="btn-empty-trash" title="휴지통 비우기">비우기</button>
        </div>
        <div id="trash-tree" class="trash-tree"></div>
      </div>
    </aside>

    <!-- 메인 영역 -->
    <main class="main-wrapper">
      <header class="toolbar">
        <div class="toolbar-content">
          <div class="toolbar-section">
            <button id="btn-toggle-sidebar" class="btn-icon" title="사이드바 토글">
              <i data-lucide="panel-left"></i>
            </button>
            <div class="toolbar-divider"></div>

            <button id="btn-search" class="btn-icon" title="검색 및 바꿈"><i data-lucide="search"></i></button>
            <button id="btn-history" class="btn-icon" title="버전 히스토리"><i data-lucide="history"></i></button>

            <div class="toolbar-divider"></div>
            
            <select id="select-font">
              <option value="MaruBuri" selected>마루부리</option>
              <option value="BookkMyungjo">부크명조</option>
              <option value="Pretendard">프리텐다드</option>
              <option value="Nanum Myeongjo">나눔명조</option>
              <option value="Noto Serif KR">본명조</option>
              <option value="Nanum Barun Gothic">나눔바른고딕</option>
            </select>

            <select id="select-heading">
              <option value="p">본문</option>
              <option value="h1">제목 1</option>
              <option value="h2">제목 2</option>
              <option value="h3">제목 3</option>
            </select>

            <div class="toolbar-divider"></div>

            <button id="btn-bold" class="btn-icon" title="굵게"><i data-lucide="bold"></i></button>
            <button id="btn-italic" class="btn-icon" title="기울임"><i data-lucide="italic"></i></button>
            <button id="btn-strike" class="btn-icon" title="취소선"><i data-lucide="strikethrough"></i></button>
            
            <div class="color-picker-wrapper btn-icon" title="글자 색상">
              <i data-lucide="palette"></i>
              <input type="color" id="input-font-color" value="#212529">
            </div>

            <div class="toolbar-divider"></div>

            <button id="btn-align-left" class="btn-icon" title="왼쪽 정렬"><i data-lucide="align-left"></i></button>
            <button id="btn-align-center" class="btn-icon" title="중앙 정렬"><i data-lucide="align-center"></i></button>
            <button id="btn-align-right" class="btn-icon" title="오른쪽 정렬"><i data-lucide="align-right"></i></button>
            <button id="btn-align-justify" class="btn-icon" title="양쪽 정렬"><i data-lucide="align-justify"></i></button>

            <div class="toolbar-divider"></div>

            <select id="select-hr">
              <option value="" disabled selected>구분선</option>
              <option value="line">실선</option>
              <option value="dashed">점선</option>
              <option value="asterisk">* * *</option>
              <option value="ornament">◇ ◇ ◇</option>
            </select>

            <button id="btn-insert-image" class="btn-icon" title="이미지 삽입"><i data-lucide="image"></i></button>
            <input type="file" id="input-image-file" accept="image/*" style="display: none;">

            <div class="toolbar-divider"></div>

            <div class="word-counter-wrapper">
              <button id="btn-word-count-toggle" class="word-count-pill-btn">
                <i data-lucide="file-text"></i>
                <span id="word-count-label">0 자</span>
              </button>
            </div>

            <div class="save-status-container">
              <span id="save-status" class="save-status">저장됨</span>
            </div>
          </div>
        </div>
      </header>

      <div id="word-count-popover" class="word-count-popover" style="display: none;">
        <div class="word-count-option active" data-mode="withSpace">
          <span>공백 포함</span>
          <span id="cnt-with-space">0자</span>
        </div>
        <div class="word-count-option" data-mode="noSpace">
          <span>공백 제외</span>
          <span id="cnt-no-space">0자</span>
        </div>
        <div class="word-count-option" data-mode="noSpaceSpecial">
          <span>공백/특수문자 제외</span>
          <span id="cnt-no-spec">0자</span>
        </div>
        <div class="word-count-option" data-mode="words">
          <span>단어 수</span>
          <span id="cnt-words">0 단어</span>
        </div>
      </div>

      <div id="search-popover-box" class="search-popover-box" style="display: none;">
        <div class="search-top-row">
          <input type="text" id="search-input" class="search-input-field" placeholder="찾을 내용">
          <span id="search-count" class="search-count-badge">0/0</span>
          <button id="btn-search-prev" class="icon-btn-sm"><i data-lucide="chevron-up"></i></button>
          <button id="btn-search-next" class="icon-btn-sm"><i data-lucide="chevron-down"></i></button>
          <button id="btn-search-close" class="icon-btn-sm"><i data-lucide="x"></i></button>
        </div>
        <div class="replace-bottom-row">
          <input type="text" id="replace-input" class="replace-input-field" placeholder="바꿀 내용">
          <button id="btn-replace" class="action-btn-sm">바꾸기</button>
          <button id="btn-replace-all" class="action-btn-sm highlight-btn">모두 바꾸기</button>
        </div>
      </div>

      <div class="main-content">
        <div class="editor-container">
          <input type="text" id="title-input" class="title-input" placeholder="대제목을 입력하세요">
          <input type="text" id="subtitle-input" class="subtitle-input" placeholder="소제목을 입력하세요">
          <hr class="header-divider">
          <div id="editor"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="context-menu" class="context-menu" style="display: none;">
    <div id="menu-rename" class="menu-item">이름 변경</div>
    <div id="menu-copy" class="menu-item">복사본 만들기</div>
    <div id="menu-delete" class="menu-item danger">휴지통으로 이동</div>
  </div>

  <div id="trash-context-menu" class="context-menu" style="display: none;">
    <div id="menu-restore" class="menu-item">복원하기</div>
    <div id="menu-permanent-delete" class="menu-item danger">영구 삭제</div>
  </div>

  <div id="history-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>버전 히스토리</h3>
        <button id="btn-close-history" class="icon-btn-sm"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">자동 저장된 이전 버전 목록입니다. 복원 시 현재 문서 상태는 백업됩니다.</p>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
